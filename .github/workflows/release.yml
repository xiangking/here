name: Release

on:
  schedule:
    - cron: "0 9 1,15 * *"
  workflow_dispatch:

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.gen.outputs.TAG }}
    steps:
      - name: Generate tag
        id: gen
        run: |
          TAG="v$(date +%Y.%m.%d)"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

  test:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libglib2.0-0 libportaudio2 portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: |
          uv sync --python 3.11 --group dev

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: uv run pytest -v --tb=short --strict-markers -p no:warnings

  release:
    needs: [tag, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.TAG }}
          name: ${{ needs.tag.outputs.TAG }}
          generate_release_notes: true
          prerelease: true

  bundle:
    needs: [tag, test, release]
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            artifact: here-${{ needs.tag.outputs.TAG }}-windows-x64.zip
          - os: macos-15
            platform: macos-arm64
            artifact: here-${{ needs.tag.outputs.TAG }}-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build bundle
        shell: bash
        run: python scripts/build_bundle.py --target "${{ matrix.platform }}" --name "here-${{ needs.tag.outputs.TAG }}-${{ matrix.platform }}"

      - name: Rename bundle artifact
        shell: bash
        run: mv "dist/here-${{ needs.tag.outputs.TAG }}-${{ matrix.platform }}.zip" "${{ matrix.artifact }}"

      - name: Upload bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.TAG }}
          files: ${{ matrix.artifact }}
