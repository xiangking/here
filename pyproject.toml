[project]
name = "here"
version = "1.6.6.dev0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy",
  "pygame",
  "openai",
  "opencc-python-reimplemented",
  "pydantic",
  "requests",
  "google-genai",
  "tiktoken",
  "anthropic",
  "PySide6-Essentials",
  "qrcode[pil]",
  "cryptography",
  "pyobjc-framework-AVFoundation; sys_platform == 'darwin'",
  "tzdata; sys_platform == 'win32'",
  "pyaudio; sys_platform == 'win32'",
  "vosk==0.3.44; sys_platform == 'win32'",
  "QtPy>=2.4.1",
  "pyyaml",
  "fal-client",
  "gpu-list",
  "py7zr",
  "edge-tts",
]

[project.optional-dependencies]
hermes = [
  "hermes-agent @ git+https://github.com/NousResearch/hermes-agent.git@0f0e20ef81709a6dd590b25af380b116db67628c",
]
asr = [
  "pyaudio",
  "vosk==0.3.44",
  "faster-whisper",
  "RealtimeSTT",
]
video = [
  "opencv_python",
]
background-removal = [
  "rembg",
]
full = [
  "pyaudio",
  "vosk==0.3.44",
  "faster-whisper",
  "RealtimeSTT",
  "opencv_python",
  "rembg",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-env",
  "pytest-mock",
]
