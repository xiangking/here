  visual_reference_image: assets/system/characters/system_sprite/system_sprite_neutral.png
  visual_identity: 系统精灵使用真人写实风格的年轻女性形象，气质自然、亲切、干净，像一位可靠的桌面助手。视觉表现应保持与参考立绘一致。
  sprite_scale: 0.3
  emotion_tags: '状态分组：核心情绪 core_emotion、系统可选情绪 system_optional_emotion、用户自定义 custom、鼠标事件
    mouse_event。

    核心情绪标准名：neutral/happy/thinking/surprised/sad/angry；这些状态允许缺少。


    立绘 1：neutral；分组：core_emotion；默认、平静、普通、neutral

    立绘 2：happy；分组：core_emotion；开心、赞同、欢迎、happy

    立绘 3：thinking；分组：core_emotion；思考、等待、犹豫、thinking

    立绘 4：surprised；分组：core_emotion；惊讶、意外、注意力被拉起、surprised

    立绘 5：sad；分组：core_emotion；难过、失落、失败、sad

    立绘 6：angry；分组：core_emotion；生气、不满、抗议、angry

    立绘 7：welcome；分组：system_optional_emotion；欢迎、招手、启动、welcome'
  speech_speed: 1.0
  speech_volume: 1.0
  pronunciation_map: {}
